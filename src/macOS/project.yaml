name: ChatGPTX

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  ChatGPTX:
    type: application
    platform: macOS
    sources:
      - path: ChatGPTX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chatgptx.launcher
        PRODUCT_NAME: ChatGPTX
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPTX
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Embed component seed
        script: '"$PROJECT_DIR/scripts/embed-component-seed.sh"'
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/component-seed"
