name: ChatGPTX

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CHATGPTX_TEST_ROOT_PATH: "$(PROJECT_TEMP_DIR)/ChatGPTXTests"

packages:
  Permiso:
    url: https://github.com/zats/permiso.git
    revision: 77afe0eb5251d6da8756aac1b24e3c01c1433f87
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 6.0.0

targets:
  ChatGPTX:
    type: application
    platform: macOS
    info:
      path: ChatGPTX/Info.plist
      properties:
        CFBundleDisplayName: ChatGPTX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSAppBundlesUsageDescription: ChatGPTX manages ChatGPT app updates.
    sources:
      - path: ChatGPTX
    dependencies:
      - package: Permiso
      - package: SnapKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chatgptx.launcher
        PRODUCT_NAME: ChatGPTX
        MARKETING_VERSION: 1.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic

  ChatGPTXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChatGPTXTests
    dependencies:
      - target: ChatGPTX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  ChatGPTX:
    build:
      targets:
        ChatGPTX: all
        ChatGPTXTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatGPTXTests
      environmentVariables:
        CHATGPTX_UNIT_TESTING: "1"
        CHATGPTX_TEST_ROOT: "$(CHATGPTX_TEST_ROOT_PATH)"
        HOME: "$(CHATGPTX_TEST_ROOT_PATH)/home"
        CODEX_HOME: "$(CHATGPTX_TEST_ROOT_PATH)/codex-home"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
