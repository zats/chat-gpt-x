name: ChatGPTX

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

packages:
  Permiso:
    url: https://github.com/zats/permiso.git
    revision: 77afe0eb5251d6da8756aac1b24e3c01c1433f87
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 6.0.0

targets:
  ChatGPTX:
    type: application
    platform: macOS
    info:
      path: ChatGPTX/Info.plist
      properties:
        CFBundleDisplayName: ChatGPTX
        NSAppBundlesUsageDescription: ChatGPTX manages ChatGPT app updates.
    sources:
      - path: ChatGPTX
    dependencies:
      - package: Permiso
      - package: SnapKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chatgptx.launcher
        PRODUCT_NAME: ChatGPTX
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Embed component seed
        script: '"$PROJECT_DIR/scripts/embed-component-seed.sh"'
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/component-seed"
