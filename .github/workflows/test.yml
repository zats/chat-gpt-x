name: ChatGPTX Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test
        required: true
        type: string
      refresh-auth:
        description: Produce refreshed authentication candidates
        required: false
        default: false
        type: boolean
    secrets:
      CHATGPTX_PRIMARY_AUTH_JSON:
        required: true
      CHATGPTX_SECONDARY_AUTH_JSON:
        required: false

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pinned ChatGPT manifest
        run: node scripts/validate-pinned-chatgpt.mjs
      - name: Validate scripts and extension launch configuration
        run: |
          bash -n scripts/download-pinned-chatgpt.sh
          bash -n scripts/download-chatgpt-version.sh
          bash -n scripts/run-local-ci.sh
          bash -n scripts/validate-rebind-changes.sh
          bash -n src/extensions/build.sh
          bash -n src/macOS/scripts/build.sh
          bash -n src/macOS/scripts/embed-component-seed.sh
          bash -n .agents/skills/manage-platform-api/scripts/extract-app.sh
          node --check scripts/auth-handoff.mjs
          node --check scripts/check-auth-exposure.mjs
          node --check scripts/capture-authentication-candidates.mjs
          node --check scripts/build-component-releases.mjs
          node --check scripts/build-component-seed.mjs
          node --check scripts/component-releases.mjs
          node --check scripts/materialize-ci-auth.mjs
          node --check scripts/trigger-chatgpt-rebind.mjs
          node --check scripts/validate-rebind-binding.mjs
          node --check scripts/validate-pinned-chatgpt.mjs
          node --check scripts/wait-for-chatgpt-ready.mjs
          bash -n scripts/publish-component-releases.sh
          bash -n scripts/publish-update-index.sh
          bash -n scripts/refresh-update-index-hashes.sh
          node --test scripts/build-component-releases.test.mjs
          node --test scripts/component-releases.test.mjs
          node --test scripts/materialize-ci-auth.test.mjs
          node --test scripts/trigger-chatgpt-rebind.test.mjs
          node --test scripts/validate-rebind-binding.test.mjs
          node --test src/platform/runtime/extension-launch-config.test.cjs

  end-to-end:
    needs: static
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install ripgrep and XcodeGen
        run: brew install ripgrep xcodegen
      - name: Restore pinned ChatGPT archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chatgpt-download-cache
          key: chatgpt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/platform/bindings/manifest.json') }}
      - name: Extract and verify pinned ChatGPT app
        id: chatgpt
        env:
          CHATGPTX_DOWNLOAD_CACHE_DIR: ${{ runner.temp }}/chatgpt-download-cache
        run: |
          app_path="$(scripts/download-pinned-chatgpt.sh "$RUNNER_TEMP/chatgpt-app")"
          echo "path=$app_path" >> "$GITHUB_OUTPUT"
      - name: Write test authentication files
        id: authentication
        env:
          PRIMARY_AUTH_JSON: ${{ secrets.CHATGPTX_PRIMARY_AUTH_JSON }}
          SECONDARY_AUTH_JSON: ${{ secrets.CHATGPTX_SECONDARY_AUTH_JSON }}
        run: |
          auth_root="$RUNNER_TEMP/chatgptx-auth"
          auth_mode="$(node scripts/materialize-ci-auth.mjs "$auth_root")"
          echo "primary=$auth_root/primary.json" >> "$GITHUB_OUTPUT"
          echo "auth-mode=$auth_mode" >> "$GITHUB_OUTPUT"
          if [[ "$auth_mode" == "chatgpt" ]]; then
            echo "secondary=$auth_root/secondary.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Build launcher and run isolated end-to-end suite
        id: end-to-end
        env:
          CHATGPT_APP_PATH: ${{ steps.chatgpt.outputs.path }}
          CHATGPTX_AUTH_OUTPUT_DIR: ${{ runner.temp }}/chatgptx-refreshed-auth
        run: |
          test_log="$RUNNER_TEMP/chatgptx-end-to-end.log"
          video_dir="$RUNNER_TEMP/chatgptx-end-to-end-video"
          recording_stop="$video_dir/.stop"
          recording_pid_file="$video_dir/.capture-pid"
          recorder_log="$RUNNER_TEMP/chatgptx-screen-recorder.log"
          mkdir -p "$video_dir"
          record_video() {
            segment=0
            while [[ ! -e "$recording_stop" ]]; do
              segment=$((segment + 1))
              printf -v segment_path '%s/segment-%04d.mov' "$video_dir" "$segment"
              screencapture -v -V30 -C -x "$segment_path" >> "$recorder_log" 2>&1 &
              capture_pid=$!
              printf '%s\n' "$capture_pid" > "$recording_pid_file"
              capture_exit_code=0
              wait "$capture_pid" || capture_exit_code=$?
              rm -f "$recording_pid_file"
              [[ "$capture_exit_code" -eq 0 ]] || {
                [[ -e "$recording_stop" ]] && return 0
                return "$capture_exit_code"
              }
            done
          }
          record_video >> "$recorder_log" 2>&1 &
          recorder_pid=$!
          sleep 1
          kill -0 "$recorder_pid" || {
            cat "$recorder_log" >&2
            echo "screen recording did not start" >&2
            exit 1
          }
          stop_recording() {
            touch "$recording_stop"
            if [[ -s "$recording_pid_file" ]]; then
              capture_pid="$(cat "$recording_pid_file")"
              if [[ "$capture_pid" =~ ^[0-9]+$ ]]; then
                kill -TERM "$capture_pid" 2>/dev/null || true
                capture_deadline=$((SECONDS + 5))
                while kill -0 "$capture_pid" 2>/dev/null; do
                  [[ "$(ps -o state= -p "$capture_pid" | tr -d ' ')" == Z ]] \
                    && break
                  if (( SECONDS >= capture_deadline )); then
                    kill -KILL "$capture_pid" 2>/dev/null || true
                    break
                  fi
                  sleep 0.1
                done
              fi
            fi
            wait "$recorder_pid" 2>/dev/null || true
          }
          discard_recording() {
            stop_recording
            rm -rf "$video_dir"
          }
          trap discard_recording EXIT INT TERM
          echo "[ci] recording end-to-end video in 30-second segments"

          set +e
          auth_paths=("${{ steps.authentication.outputs.primary }}")
          if [[ -n "${{ steps.authentication.outputs.secondary }}" ]]; then
            auth_paths+=("${{ steps.authentication.outputs.secondary }}")
          fi
          CHATGPTX_PROGRESS_FD=3 scripts/run-local-ci.sh \
            "${auth_paths[@]}" \
            3>&1 \
            > "$test_log" 2>&1
          test_exit_code=$?
          set -e
          if [[ "$test_exit_code" -eq 0 ]]; then
            echo "[ci] end-to-end suite passed; discarding recording"
            discard_recording
          else
            echo "[ci] end-to-end suite failed; finalizing recording"
            stop_recording
          fi
          trap - EXIT INT TERM

          auth_paths=(
            "${{ steps.authentication.outputs.primary }}"
          )
          if [[ -n "${{ steps.authentication.outputs.secondary }}" ]]; then
            auth_paths+=("${{ steps.authentication.outputs.secondary }}")
          fi
          for candidate in \
            "$CHATGPTX_AUTH_OUTPUT_DIR/primary.json" \
            "$CHATGPTX_AUTH_OUTPUT_DIR/secondary.json"; do
            [[ ! -f "$candidate" ]] || auth_paths+=("$candidate")
          done
          node scripts/check-auth-exposure.mjs \
            "${auth_paths[@]}" \
            -- \
            "$test_log"
          cat "$test_log"
          exit "$test_exit_code"
      - name: Upload failed end-to-end video
        if: failure() && steps.end-to-end.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-video-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chatgptx-end-to-end-video/*.mov
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt refreshed authentication candidates
        if: always() && inputs.refresh-auth && steps.authentication.outcome == 'success'
        id: authentication-handoff
        run: |
          candidate_root="$RUNNER_TEMP/chatgptx-refreshed-auth"
          if [[ ! -f "$candidate_root/primary.json" || ! -f "$candidate_root/secondary.json" ]]; then
            echo "No authentication candidates were captured"
            exit 0
          fi
          encrypted_root="$RUNNER_TEMP/chatgptx-auth-handoff"
          node scripts/auth-handoff.mjs \
            encrypt \
            .github/ci-auth-refresh-public.pem \
            "$candidate_root" \
            "$encrypted_root"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted authentication candidates
        if: always() && steps.authentication-handoff.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-auth-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chatgptx-auth-handoff
          if-no-files-found: error
          retention-days: 1
      - name: Delete authentication and extracted app files
        if: always()
        run: >-
          rm -rf
          "$RUNNER_TEMP/chatgptx-auth"
          "$RUNNER_TEMP/chatgptx-refreshed-auth"
          "$RUNNER_TEMP/chatgptx-auth-handoff"
          "$RUNNER_TEMP/chatgptx-end-to-end.log"
          "$RUNNER_TEMP/chatgptx-end-to-end-video"
          "$RUNNER_TEMP/chatgptx-screen-recorder.log"
          "$RUNNER_TEMP/chatgpt-app"
