name: Rebind ChatGPT

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      version:
        description: ChatGPT app version
        required: true
        type: string
      download_url:
        description: Exact Sparkle enclosure URL
        required: true
        type: string
      issue_number:
        description: Version-watcher issue number
        required: true
        type: string
      force:
        description: Re-run and increment an existing binding version
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - chatgpt-version-detected

concurrency:
  group: rebind-chatgpt-version-${{ inputs.version || github.event.client_payload.version || github.event.issue.title || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.label.name == 'pending' &&
        startsWith(github.event.issue.title, 'ChatGPT ') &&
        endsWith(github.event.issue.title, ' available')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
      download-url: ${{ steps.request.outputs.download-url }}
      issue-number: ${{ steps.request.outputs.issue-number }}
      force: ${{ steps.request.outputs.force }}
      validation-error: ${{ steps.request.outputs.validation-error }}
    steps:
      - name: Validate request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DOWNLOAD_URL: ${{ inputs.download_url }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_FORCE: ${{ inputs.force }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
          PAYLOAD_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          PAYLOAD_FORCE: ${{ github.event.client_payload.force }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          invalid() {
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "validation-error=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT_NAME" == "issues" ]]; then
            [[ "$ISSUE_TITLE" =~ ^ChatGPT\ ([0-9]+(\.[0-9]+)+)\ available$ ]] ||
              invalid "Issue title must match: ChatGPT <numeric version> available."
            title_version="${BASH_REMATCH[1]}"
            metadata="$(
              jq -ce '
                select(
                  type == "object" and
                  .schema == 1 and
                  (.version | type) == "string" and
                  (.download_url | type) == "string" and
                  (
                    (keys | sort) == ["download_url", "schema", "version"] or
                    (
                      .force == true and
                      (keys | sort) == ["download_url", "force", "schema", "version"]
                    )
                  )
                )
              ' <<< "$ISSUE_BODY" 2>/dev/null
            )" ||
              invalid "Issue body must contain valid ChatGPTX version metadata JSON."
            request_version="$(jq -r .version <<< "$metadata")"
            [[ "$request_version" == "$title_version" ]] ||
              invalid "Issue title and JSON version do not match."
            request_download_url="$(jq -r .download_url <<< "$metadata")"
            request_issue_number="$EVENT_ISSUE_NUMBER"
            request_force="$(jq -r '.force // false' <<< "$metadata")"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            request_version="$PAYLOAD_VERSION"
            request_download_url="$PAYLOAD_DOWNLOAD_URL"
            request_issue_number="$PAYLOAD_ISSUE_NUMBER"
            request_force="$PAYLOAD_FORCE"
          else
            request_version="$INPUT_VERSION"
            request_download_url="$INPUT_DOWNLOAD_URL"
            request_issue_number="$INPUT_ISSUE_NUMBER"
            request_force="$INPUT_FORCE"
          fi

          [[ "$request_version" =~ ^[0-9]+(\.[0-9]+)+$ ]] ||
            invalid "Version must contain numeric dot-separated components."
          expected_url="https://persistent.oaistatic.com/codex-app-prod/ChatGPT-darwin-arm64-$request_version.zip"
          [[ "$request_download_url" == "$expected_url" ]] ||
            invalid "Download URL must be $expected_url."
          [[ "$request_issue_number" =~ ^[1-9][0-9]*$ ]] ||
            invalid "Issue number must be a positive integer."
          case "$request_force" in
            "" | false)
              request_force=false
              ;;
            true)
              ;;
            *)
              invalid "Force must be true or false."
              ;;
          esac
          {
            echo "valid=true"
            echo "version=$request_version"
            echo "download-url=$request_download_url"
            echo "issue-number=$request_issue_number"
            echo "force=$request_force"
          } >> "$GITHUB_OUTPUT"

      - name: Require valid request
        env:
          REQUEST_VALID: ${{ steps.request.outputs.valid }}
          VALIDATION_ERROR: ${{ steps.request.outputs.validation-error }}
        run: |
          [[ "$REQUEST_VALID" == "true" ]] || {
            echo "$VALIDATION_ERROR" >&2
            exit 1
          }

  mark-issue-in-progress:
    needs: request
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark issue in progress
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.request.outputs.issue-number }}
        run: |
          gh label create in-progress \
            --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 \
            --description "Binding generation is running" \
            --force
          gh label create failed \
            --repo "$GITHUB_REPOSITORY" \
            --color D73A4A \
            --description "Binding generation failed" \
            --force
          gh label create success \
            --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 \
            --description "Binding generation succeeded" \
            --force

          if [[ "$(
            gh issue view "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json state \
              --jq .state
          )" == "CLOSED" ]]; then
            gh issue reopen "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

          current_labels="$(
            gh issue view "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )"
          for label in pending in-progress failed success; do
            if grep -Fxq "$label" <<< "$current_labels"; then
              gh issue edit "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --remove-label "$label"
            fi
          done
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label in-progress

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Binding generation started: [workflow run #$GITHUB_RUN_NUMBER]($run_url)."

  generate:
    needs:
      - request
      - mark-issue-in-progress
    runs-on: macos-26
    timeout-minutes: 360
    environment: codex-agent
    permissions:
      contents: read
    outputs:
      version: ${{ needs.request.outputs.version }}
      download-url: ${{ needs.request.outputs.download-url }}
      issue-number: ${{ needs.request.outputs.issue-number }}
      binding-mode: ${{ steps.binding-mode.outputs.mode }}
      base-sha: ${{ steps.base.outputs.sha }}
      codex-version: ${{ steps.codex.outputs.version }}
      patch-artifact: ${{ steps.patch.outputs.artifact-name }}
      auth-handoff-artifact: ${{ steps.authentication-handoff.outputs.artifact-name }}
      app-validation-error: ${{ steps.chatgpt.outputs.validation-error }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Record tested base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine binding mode
        id: binding-mode
        env:
          APP_VERSION: ${{ needs.request.outputs.version }}
          FORCE: ${{ needs.request.outputs.force }}
        run: |
          binding_root="src/platform/bindings/$APP_VERSION"
          if git cat-file -e "HEAD:$binding_root" 2>/dev/null; then
            [[ "$FORCE" == "true" ]] || {
              echo "Binding $APP_VERSION exists and requires a force request." >&2
              exit 1
            }
            echo "mode=correction" >> "$GITHUB_OUTPUT"
          else
            echo "mode=new" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: brew install ripgrep xcodegen

      - name: Download and validate requested ChatGPT app
        id: chatgpt
        env:
          APP_VERSION: ${{ needs.request.outputs.version }}
          DOWNLOAD_URL: ${{ needs.request.outputs.download-url }}
        run: |
          error_path="$RUNNER_TEMP/chatgpt-download-error.log"
          set +e
          app_path="$(
            scripts/download-chatgpt-version.sh \
              "$APP_VERSION" \
              "$DOWNLOAD_URL" \
              "$RUNNER_TEMP/chatgpt-app"
          )" 2> "$error_path"
          download_status=$?
          set -e
          if (( download_status != 0 )); then
            validation_error="$(
              tr '\r\n' '  ' < "$error_path" |
                sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//'
            )"
            [[ -n "$validation_error" ]] ||
              validation_error="The ChatGPT archive could not be downloaded or validated."
            {
              echo "valid=false"
              echo "validation-error=$validation_error"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "valid=true"
            echo "path=$app_path"
          } >> "$GITHUB_OUTPUT"

      - name: Require valid requested ChatGPT app
        env:
          APP_VALID: ${{ steps.chatgpt.outputs.valid }}
          VALIDATION_ERROR: ${{ steps.chatgpt.outputs.validation-error }}
        run: |
          [[ "$APP_VALID" == "true" ]] || {
            echo "$VALIDATION_ERROR" >&2
            exit 1
          }

      - name: Install bundled Codex toolchain
        id: codex
        env:
          CHATGPT_APP_PATH: ${{ steps.chatgpt.outputs.path }}
        run: |
          resources_path="$CHATGPT_APP_PATH/Contents/Resources"
          mkdir -p "$RUNNER_TEMP/bin"
          for executable in codex codex-code-mode-host; do
            source_path="$resources_path/$executable"
            [[ -x "$source_path" ]] || {
              echo "downloaded ChatGPT app has no bundled $executable executable" >&2
              exit 1
            }
            install -m 755 "$source_path" "$RUNNER_TEMP/bin/$executable"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          codex_version="$("$RUNNER_TEMP/bin/codex" --version | awk '{print $2}')"
          [[ "$codex_version" =~ ^[0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?$ ]]
          echo "version=$codex_version" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/bin/codex" --version

      - name: Materialize authentication
        id: authentication
        env:
          AGENT_AUTH_JSON: ${{ secrets.CODEX_AGENT_AUTH_JSON }}
          PRIMARY_AUTH_JSON: ${{ secrets.CHATGPTX_PRIMARY_AUTH_JSON }}
          SECONDARY_AUTH_JSON: ${{ secrets.CHATGPTX_SECONDARY_AUTH_JSON }}
        run: |
          [[ -n "$AGENT_AUTH_JSON" ]] || {
            echo "CODEX_AGENT_AUTH_JSON is required" >&2
            exit 1
          }
          agent_home="$RUNNER_TEMP/codex-agent-home"
          auth_root="$RUNNER_TEMP/chatgptx-auth"
          candidate_root="$RUNNER_TEMP/chatgptx-refreshed-auth"
          diagnostics_root="$RUNNER_TEMP/chatgptx-rebind-diagnostics"
          mkdir -p "$agent_home" "$auth_root" "$candidate_root" "$diagnostics_root"
          chmod 700 "$agent_home" "$auth_root" "$candidate_root"
          printf '%s' "$AGENT_AUTH_JSON" > "$agent_home/auth.json"
          chmod 600 "$agent_home/auth.json"
          auth_mode="$(
            node scripts/materialize-ci-auth.mjs \
              "$auth_root" \
              "$candidate_root"
          )"
          jq -e '.tokens | type == "object" and has("access_token") and has("refresh_token")' \
            "$agent_home/auth.json" >/dev/null
          cp scripts/auth-handoff.mjs "$RUNNER_TEMP/trusted-auth-handoff.mjs"
          : > "$diagnostics_root/agent.jsonl"
          : > "$diagnostics_root/agent-final.txt"
          : > "$diagnostics_root/binding.patch"
          {
            echo "agent-home=$agent_home"
            echo "auth-root=$auth_root"
            echo "candidate-root=$candidate_root"
            echo "diagnostics-root=$diagnostics_root"
            echo "auth-mode=$auth_mode"
            echo "primary=$auth_root/primary.json"
          } >> "$GITHUB_OUTPUT"
          if [[ "$auth_mode" == "chatgpt" ]]; then
            echo "secondary=$auth_root/secondary.json" >> "$GITHUB_OUTPUT"
          fi
          CODEX_HOME="$agent_home" codex login status

      - name: Run Codex rebind agent
        id: agent
        env:
          APP_VERSION: ${{ needs.request.outputs.version }}
          DOWNLOAD_URL: ${{ needs.request.outputs.download-url }}
          ISSUE_NUMBER: ${{ needs.request.outputs.issue-number }}
          BINDING_MODE: ${{ steps.binding-mode.outputs.mode }}
          AUTH_MODE: ${{ steps.authentication.outputs.auth-mode }}
          CHATGPT_APP_PATH: ${{ steps.chatgpt.outputs.path }}
          AGENT_CODEX_HOME: ${{ steps.authentication.outputs.agent-home }}
          AUTH_ROOT: ${{ steps.authentication.outputs.auth-root }}
          DIAGNOSTICS_ROOT: ${{ steps.authentication.outputs.diagnostics-root }}
        run: |
          prompt_path="$RUNNER_TEMP/rebind-prompt.md"
          if [[ "$BINDING_MODE" == "correction" ]]; then
            task="correct the existing binding for ChatGPT $APP_VERSION"
            binding_instructions="Edit src/platform/bindings/$APP_VERSION and increment its binding patch version by exactly one. Preserve its chatgpt and chatgptApi values. Keep every other binding directory, src/platform/types.d.ts, extension source, and extension manifests unchanged. Update src/platform/bindings/manifest.json only if needed to pin the exact version and URL. Increment updates/latest.json generation once and replace this build's schema-3 binding entry, including its exact asarSha256. Preserve every other API, binding, and extension entry and all extension version history. Set the changed binding sha256 to 64 zeroes; the workflow replaces it with the deterministic archive hash before validation."
          else
            task="complete the new binding for ChatGPT $APP_VERSION"
            binding_instructions="Use the newest completed binding as the prior implementation. Keep src/platform/types.d.ts, extension source files, extension manifests, and every existing binding directory unchanged. Create src/platform/bindings/$APP_VERSION with binding version 1.0.0. Update src/platform/bindings/manifest.json and add the exact binding to the schema-3 updates/latest.json map, including its asarSha256. Increment the update generation once and preserve every existing API, binding, extension, and historical extension version entry. Set the new binding sha256 to 64 zeroes; the workflow replaces it with the deterministic archive hash before validation."
          fi
          if [[ "$AUTH_MODE" == "apikey" ]]; then
            authentication_files="- $AUTH_ROOT/primary.json (API-key authentication)"
            final_test="CHATGPT_APP_PATH=\"$CHATGPT_APP_PATH\" scripts/run-local-ci.sh \"$AUTH_ROOT/primary.json\""
            authentication_scope="The harness disables profile-dependent gates in API-key mode. Complete every remaining gate."
          else
            authentication_files="- $AUTH_ROOT/primary.json
          - $AUTH_ROOT/secondary.json"
            final_test="CHATGPT_APP_PATH=\"$CHATGPT_APP_PATH\" scripts/run-local-ci.sh \"$AUTH_ROOT/primary.json\" \"$AUTH_ROOT/secondary.json\""
            authentication_scope="Complete every gate, including profile-dependent gates and account switching."
          fi
          cat > "$prompt_path" <<PROMPT
          Use \$rebind-chatgpt-version and $task.

          Exact stock app: $CHATGPT_APP_PATH
          Exact Sparkle URL: $DOWNLOAD_URL
          Version-watcher issue: #$ISSUE_NUMBER

          Follow the skill's completion gate for $BINDING_MODE mode. $binding_instructions

          Test authentication is available only through these opaque files:
          $authentication_files

          Never inspect, print, summarize, copy into the repository, or expose authentication contents. Pass the paths directly to tests. For the final deterministic test use:

          $final_test

          $authentication_scope Work until the binding passes the stable public API suite, current native UI suite, shipped-extension composition, manifest validation, and the skill's applicable remaining gates. Do not commit, push, open a pull request, modify workflow files, or weaken tests. If genuinely blocked, leave the useful binding changes in the worktree and report the exact failure.
          PROMPT

          set +e
          CODEX_HOME="$AGENT_CODEX_HOME" codex exec \
            --ignore-user-config \
            --strict-config \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="xhigh"' \
            --config 'service_tier="fast"' \
            --dangerously-bypass-approvals-and-sandbox \
            --color never \
            --json \
            --output-last-message "$DIAGNOSTICS_ROOT/agent-final.txt" \
            --cd "$GITHUB_WORKSPACE" \
            - < "$prompt_path" 2>&1 |
            tee "$DIAGNOSTICS_ROOT/agent.jsonl"
          agent_exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit-code=$agent_exit_code" >> "$GITHUB_OUTPUT"

      - name: Finalize update index hashes
        if: steps.agent.outputs.exit-code == '0'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: scripts/refresh-update-index-hashes.sh "$BASE_SHA"

      - name: Validate agent change scope
        id: scope
        if: steps.agent.outputs.exit-code == '0'
        env:
          APP_VERSION: ${{ needs.request.outputs.version }}
          DOWNLOAD_URL: ${{ needs.request.outputs.download-url }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BINDING_MODE: ${{ steps.binding-mode.outputs.mode }}
        run: scripts/validate-rebind-changes.sh "$APP_VERSION" "$DOWNLOAD_URL" "$BASE_SHA" "$BINDING_MODE"

      - name: Create scoped binding patch
        id: patch
        if: steps.scope.outcome == 'success'
        env:
          APP_VERSION: ${{ needs.request.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DIAGNOSTICS_ROOT: ${{ steps.authentication.outputs.diagnostics-root }}
        run: |
          git diff --check "$BASE_SHA"
          git add -N "src/platform/bindings/$APP_VERSION"
          git diff --binary "$BASE_SHA" -- \
            "src/platform/bindings/$APP_VERSION" \
            src/platform/bindings/manifest.json \
            updates/latest.json \
            > "$DIAGNOSTICS_ROOT/binding.patch"
          [[ -s "$DIAGNOSTICS_ROOT/binding.patch" ]] || {
            echo "scoped binding patch is empty" >&2
            exit 1
          }
          artifact_name="chatgpt-binding-$APP_VERSION-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Check diagnostics for authentication exposure
        id: exposure
        if: always() && steps.authentication.outcome == 'success'
        env:
          AGENT_HOME: ${{ steps.authentication.outputs.agent-home }}
          AUTH_ROOT: ${{ steps.authentication.outputs.auth-root }}
          CANDIDATE_ROOT: ${{ steps.authentication.outputs.candidate-root }}
          DIAGNOSTICS_ROOT: ${{ steps.authentication.outputs.diagnostics-root }}
        run: |
          auth_paths=(
            "$AGENT_HOME/auth.json"
          )
          for auth_path in \
            "$AUTH_ROOT/primary.json" \
            "$AUTH_ROOT/secondary.json" \
            "$CANDIDATE_ROOT/primary.json" \
            "$CANDIDATE_ROOT/secondary.json"; do
            [[ ! -f "$auth_path" ]] || auth_paths+=("$auth_path")
          done
          node scripts/check-auth-exposure.mjs \
            "${auth_paths[@]}" \
            -- \
            "$DIAGNOSTICS_ROOT/agent.jsonl" \
            "$DIAGNOSTICS_ROOT/agent-final.txt" \
            "$DIAGNOSTICS_ROOT/binding.patch"

      - name: Upload binding patch
        if: >-
          steps.patch.outcome == 'success' &&
          steps.exposure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.patch.outputs.artifact-name }}
          path: ${{ steps.authentication.outputs.diagnostics-root }}/binding.patch
          if-no-files-found: error
          retention-days: 7

      - name: Encrypt authentication handoff
        if: always() && steps.authentication.outcome == 'success'
        id: authentication-handoff
        env:
          AGENT_HOME: ${{ steps.authentication.outputs.agent-home }}
          AUTH_MODE: ${{ steps.authentication.outputs.auth-mode }}
          CANDIDATE_ROOT: ${{ steps.authentication.outputs.candidate-root }}
        run: |
          cp "$AGENT_HOME/auth.json" "$CANDIDATE_ROOT/agent.json"
          chmod 600 "$CANDIDATE_ROOT/agent.json"
          encrypted_root="$RUNNER_TEMP/chatgptx-auth-handoff"
          labels=(agent)
          artifact_name="rebind-agent-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$AUTH_MODE" == "chatgpt" ]]; then
            labels=(primary secondary agent)
            artifact_name="ci-auth-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          node "$RUNNER_TEMP/trusted-auth-handoff.mjs" \
            encrypt \
            .github/ci-auth-refresh-public.pem \
            "$CANDIDATE_ROOT" \
            "$encrypted_root" \
            "${labels[@]}"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted authentication handoff
        if: always() && steps.authentication-handoff.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.authentication-handoff.outputs.artifact-name }}
          path: ${{ runner.temp }}/chatgptx-auth-handoff
          if-no-files-found: error
          retention-days: 1

      - name: Report agent result
        if: always() && steps.exposure.outcome == 'success'
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit-code }}
          DIAGNOSTICS_ROOT: ${{ steps.authentication.outputs.diagnostics-root }}
        run: |
          if [[ "$AGENT_EXIT_CODE" != "0" ]]; then
            echo "Codex exited with status $AGENT_EXIT_CODE"
            rg -n -i '"type":"error"|error:|failed|failure|exception|fatal' \
              "$DIAGNOSTICS_ROOT/agent.jsonl" || true
          fi
          if [[ -s "$DIAGNOSTICS_ROOT/agent-final.txt" ]]; then
            cat "$DIAGNOSTICS_ROOT/agent-final.txt"
          fi

      - name: Upload failure diagnostics
        if: >-
          always() &&
          steps.exposure.outcome == 'success' &&
          (
            steps.agent.outputs.exit-code != '0' ||
            steps.scope.outcome == 'failure' ||
            steps.patch.outcome == 'failure'
          )
        uses: actions/upload-artifact@v4
        with:
          name: rebind-failure-${{ needs.request.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.authentication.outputs.diagnostics-root }}/agent.jsonl
            ${{ steps.authentication.outputs.diagnostics-root }}/agent-final.txt
            ${{ steps.authentication.outputs.diagnostics-root }}/binding.patch
          if-no-files-found: error
          retention-days: 7

      - name: Remove sensitive files
        if: always()
        run: >-
          rm -rf
          "$RUNNER_TEMP/codex-agent-home"
          "$RUNNER_TEMP/chatgptx-auth"
          "$RUNNER_TEMP/chatgptx-refreshed-auth"
          "$RUNNER_TEMP/chatgptx-auth-handoff"
          "$RUNNER_TEMP/trusted-auth-handoff.mjs"
          "$RUNNER_TEMP/chatgpt-app"

      - name: Require successful binding
        if: always()
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit-code }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          EXPOSURE_OUTCOME: ${{ steps.exposure.outcome }}
        run: |
          [[ "$AGENT_EXIT_CODE" == "0" ]]
          [[ "$SCOPE_OUTCOME" == "success" ]]
          [[ "$PATCH_OUTCOME" == "success" ]]
          [[ "$EXPOSURE_OUTCOME" == "success" ]]

  open-pull-request:
    needs: generate
    runs-on: ubuntu-latest
    environment: ci-auth-refresh
    permissions:
      contents: write
      pull-requests: write
    outputs:
      head-sha: ${{ steps.binding-final.outputs.head-sha }}
      pr-number: ${{ steps.pull-request.outputs.number }}
      pr-url: ${{ steps.pull-request.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate.outputs.patch-artifact }}
          path: ${{ runner.temp }}/binding-patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Commit binding and attempt rebase
        id: binding
        env:
          APP_VERSION: ${{ needs.generate.outputs.version }}
          BINDING_MODE: ${{ needs.generate.outputs.binding-mode }}
          ISSUE_NUMBER: ${{ needs.generate.outputs.issue-number }}
        run: |
          git apply --index "$RUNNER_TEMP/binding-patch/binding.patch"
          git diff --cached --check
          branch_name="codex/bindings-chatgpt-$APP_VERSION-issue-$ISSUE_NUMBER"
          git switch -c "$branch_name"
          git config user.name "chat-gpt-x[bot]"
          git config user.email "chat-gpt-x[bot]@users.noreply.github.com"
          if [[ "$BINDING_MODE" == "correction" ]]; then
            commit_action="Update"
          else
            commit_action="Create"
          fi
          git commit -m "$commit_action bindings for ChatGPT $APP_VERSION"
          git fetch --no-tags origin main
          latest_main_sha="$(git rev-parse FETCH_HEAD)"
          echo "latest-main-sha=$latest_main_sha" >> "$GITHUB_OUTPUT"
          if git rebase "$latest_main_sha"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=U \
            > "$RUNNER_TEMP/rebase-conflicts.txt"
          [[ -s "$RUNNER_TEMP/rebase-conflicts.txt" ]] || {
            echo "Rebase failed without reporting conflicted files." >&2
            exit 1
          }
          while IFS= read -r index_line; do
            conflict_path="${index_line#*$'\t'}"
            if ! grep -Fxq \
              "$conflict_path" \
              "$RUNNER_TEMP/rebase-conflicts.txt"; then
              printf '%s\n' "$index_line"
            fi
          done < <(git ls-files --stage) \
            > "$RUNNER_TEMP/rebase-index-before.txt"
          echo "conflicted=true" >> "$GITHUB_OUTPUT"

      - name: Download authentication handoff
        if: steps.binding.outputs.conflicted == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate.outputs.auth-handoff-artifact }}
          path: ${{ runner.temp }}/rebase-auth-handoff

      - name: Install rebase resolver Codex CLI
        if: steps.binding.outputs.conflicted == 'true'
        env:
          CODEX_VERSION: ${{ needs.generate.outputs.codex-version }}
        run: |
          codex_prefix="$RUNNER_TEMP/codex-npm"
          npm install \
            --global \
            --prefix "$codex_prefix" \
            "@openai/codex@$CODEX_VERSION"
          echo "$codex_prefix/bin" >> "$GITHUB_PATH"
          installed_version="$("$codex_prefix/bin/codex" --version | awk '{print $2}')"
          [[ "$installed_version" == "$CODEX_VERSION" ]]

      - name: Materialize rebase resolver authentication
        if: steps.binding.outputs.conflicted == 'true'
        id: resolver-authentication
        env:
          HANDOFF_PRIVATE_KEY: ${{ secrets.CHATGPTX_AUTH_HANDOFF_PRIVATE_KEY }}
        run: |
          [[ -n "$HANDOFF_PRIVATE_KEY" ]] || {
            echo "CHATGPTX_AUTH_HANDOFF_PRIVATE_KEY is required." >&2
            exit 1
          }
          key_path="$RUNNER_TEMP/rebase-auth-handoff-private.pem"
          decrypted_root="$RUNNER_TEMP/rebase-auth-decrypted"
          resolver_home="$RUNNER_TEMP/codex-rebase-home"
          printf '%s' "$HANDOFF_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          node scripts/auth-handoff.mjs \
            decrypt \
            "$key_path" \
            "$RUNNER_TEMP/rebase-auth-handoff" \
            "$decrypted_root" \
            agent
          mkdir -p "$resolver_home"
          chmod 700 "$resolver_home"
          install -m 600 "$decrypted_root/agent.json" "$resolver_home/auth.json"
          jq -e \
            '.tokens | type == "object" and has("access_token") and has("refresh_token")' \
            "$resolver_home/auth.json" >/dev/null
          echo "home=$resolver_home" >> "$GITHUB_OUTPUT"
          CODEX_HOME="$resolver_home" codex login status

      - name: Resolve rebase conflicts with Codex
        if: steps.binding.outputs.conflicted == 'true'
        id: rebase-resolver
        env:
          AGENT_CODEX_HOME: ${{ steps.resolver-authentication.outputs.home }}
          APP_VERSION: ${{ needs.generate.outputs.version }}
          BINDING_MODE: ${{ needs.generate.outputs.binding-mode }}
          BASE_SHA: ${{ needs.generate.outputs.base-sha }}
          LATEST_MAIN_SHA: ${{ steps.binding.outputs.latest-main-sha }}
        run: |
          prompt_path="$RUNNER_TEMP/rebase-resolver-prompt.md"
          conflicts="$(
            sed 's/^/- /' "$RUNNER_TEMP/rebase-conflicts.txt"
          )"
          cat > "$prompt_path" <<PROMPT
          Resolve only the active git rebase conflicts for the generated ChatGPT $APP_VERSION binding.

          The binding was fully generated and validated from tested base $BASE_SHA. It is being rebased onto current main $LATEST_MAIN_SHA.

          Conflicted files:
          $conflicts

          Preserve the current main changes and the generated binding changes. Follow the repository versioning and update-manifest invariants. For new mode, add the new binding entry and keep extension manifests unchanged. For correction mode, increment the target binding patch version by exactly one from current main, replace its binding entry, and keep extension manifests unchanged. Preserve the schema-3 maps, exact binding asarSha256 values, every other API and binding entry, and all extension version history. Increment updates/latest.json generation exactly once from current main. A changed release may use 64 zeroes for sha256 because the workflow computes its deterministic archive hash after the rebase. The binding mode is $BINDING_MODE.

          Modify only the conflicted files listed above. Do not stage files, commit, continue or abort the rebase, push, inspect authentication, weaken validation, or modify any non-conflicted file. Remove every conflict marker and run git diff --check. Finish only when the conflicted files contain the complete resolution.
          PROMPT

          set +e
          CODEX_HOME="$AGENT_CODEX_HOME" codex exec \
            --ignore-user-config \
            --strict-config \
            --model gpt-5.6-terra \
            --config 'model_reasoning_effort="high"' \
            --config 'service_tier="fast"' \
            --dangerously-bypass-approvals-and-sandbox \
            --color never \
            --json \
            --output-last-message "$RUNNER_TEMP/rebase-resolver-final.txt" \
            --cd "$GITHUB_WORKSPACE" \
            - < "$prompt_path" 2>&1 |
            tee "$RUNNER_TEMP/rebase-resolver.jsonl"
          resolver_exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit-code=$resolver_exit_code" >> "$GITHUB_OUTPUT"

      - name: Check rebase diagnostics for authentication exposure
        if: >-
          always() &&
          steps.binding.outputs.conflicted == 'true' &&
          steps.resolver-authentication.outcome == 'success'
        id: rebase-exposure
        env:
          AGENT_HOME: ${{ steps.resolver-authentication.outputs.home }}
        run: |
          node scripts/check-auth-exposure.mjs \
            "$AGENT_HOME/auth.json" \
            -- \
            "$RUNNER_TEMP/rebase-resolver.jsonl" \
            "$RUNNER_TEMP/rebase-resolver-final.txt"

      - name: Validate and push binding
        if: always() && steps.binding.outcome == 'success'
        id: binding-final
        env:
          APP_VERSION: ${{ needs.generate.outputs.version }}
          DOWNLOAD_URL: ${{ needs.generate.outputs.download-url }}
          BINDING_MODE: ${{ needs.generate.outputs.binding-mode }}
          LATEST_MAIN_SHA: ${{ steps.binding.outputs.latest-main-sha }}
          REBASE_CONFLICTED: ${{ steps.binding.outputs.conflicted }}
          RESOLVER_AUTHENTICATION_OUTCOME: ${{ steps.resolver-authentication.outcome }}
          RESOLVER_EXIT_CODE: ${{ steps.rebase-resolver.outputs.exit-code }}
          REBASE_EXPOSURE_OUTCOME: ${{ steps.rebase-exposure.outcome }}
          ISSUE_NUMBER: ${{ needs.generate.outputs.issue-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REBASE_CONFLICTED" == "true" ]]; then
            [[ "$RESOLVER_AUTHENTICATION_OUTCOME" == "success" ]]
            [[ "$RESOLVER_EXIT_CODE" == "0" ]]
            [[ "$REBASE_EXPOSURE_OUTCOME" == "success" ]]

            while IFS= read -r index_line; do
              conflict_path="${index_line#*$'\t'}"
              if ! grep -Fxq \
                "$conflict_path" \
                "$RUNNER_TEMP/rebase-conflicts.txt"; then
                printf '%s\n' "$index_line"
              fi
            done < <(git ls-files --stage) \
              > "$RUNNER_TEMP/rebase-index-after.txt"
            cmp \
              "$RUNNER_TEMP/rebase-index-before.txt" \
              "$RUNNER_TEMP/rebase-index-after.txt" || {
              echo "Codex changed the index outside the conflicted files." >&2
              exit 1
            }

            comm -23 \
              <(git diff --name-only | sort) \
              <(sort "$RUNNER_TEMP/rebase-conflicts.txt") \
              > "$RUNNER_TEMP/rebase-unexpected-paths.txt"
            [[ ! -s "$RUNNER_TEMP/rebase-unexpected-paths.txt" ]] || {
              echo "Codex changed non-conflicted files:" >&2
              cat "$RUNNER_TEMP/rebase-unexpected-paths.txt" >&2
              exit 1
            }
            git ls-files --others --exclude-standard \
              > "$RUNNER_TEMP/rebase-untracked-paths.txt"
            [[ ! -s "$RUNNER_TEMP/rebase-untracked-paths.txt" ]] || {
              echo "Codex created untracked files:" >&2
              cat "$RUNNER_TEMP/rebase-untracked-paths.txt" >&2
              exit 1
            }

            while IFS= read -r conflict_path; do
              if grep -nE \
                '^(<<<<<<<|=======|>>>>>>>)' \
                "$conflict_path"; then
                echo "Conflict markers remain in $conflict_path." >&2
                exit 1
              fi
              git add -- "$conflict_path"
            done < "$RUNNER_TEMP/rebase-conflicts.txt"
            [[ -z "$(git diff --name-only --diff-filter=U)" ]]
            git diff --cached --check
            GIT_EDITOR=true git rebase --continue
          fi

          scripts/refresh-update-index-hashes.sh "$LATEST_MAIN_SHA"
          if ! git diff --quiet -- updates/latest.json; then
            git add updates/latest.json
            git commit --amend --no-edit
          fi

          git diff --check "$LATEST_MAIN_SHA"
          binding_root="src/platform/bindings/$APP_VERSION"
          node scripts/validate-rebind-binding.mjs \
            "$BINDING_MODE" \
            "$LATEST_MAIN_SHA" \
            "$APP_VERSION"
          binding_entries=("$binding_root"/*)
          [[ "${#binding_entries[@]}" == "4" ]]
          for binding_entry in "${binding_entries[@]}"; do
            [[ -f "$binding_entry" && ! -L "$binding_entry" ]]
            case "$(basename "$binding_entry")" in
              DERIVATION.md | host.js | manifest.json | ui-test.mjs)
                ;;
              *)
                echo "Unexpected binding file: $binding_entry" >&2
                exit 1
                ;;
            esac
          done
          while IFS= read -r changed_path; do
            if [[ "$BINDING_MODE" == "new" ]]; then
              case "$changed_path" in
                "$binding_root"/* | src/platform/bindings/manifest.json | updates/latest.json)
                  ;;
                *)
                  echo "Rebase changed a forbidden path: $changed_path" >&2
                  exit 1
                  ;;
              esac
            else
              case "$changed_path" in
                "$binding_root"/* | src/platform/bindings/manifest.json | updates/latest.json)
                  ;;
                *)
                  echo "Binding correction changed a forbidden path: $changed_path" >&2
                  exit 1
                  ;;
              esac
            fi
          done < <(git diff --name-only "$LATEST_MAIN_SHA" HEAD)
          jq -e \
            --arg version "$APP_VERSION" \
            '.chatgpt == $version' \
            "$binding_root/manifest.json" >/dev/null
          jq -e \
            --arg version "$APP_VERSION" \
            --arg url "$DOWNLOAD_URL" \
            '.chatgpt == $version and .downloadUrl == $url' \
            src/platform/bindings/manifest.json >/dev/null
          node scripts/validate-pinned-chatgpt.mjs
          node scripts/component-releases.mjs "$LATEST_MAIN_SHA" --worktree
          [[ -z "$(git status --porcelain)" ]]

          binding_sha="$(git rev-parse HEAD)"
          [[ "$binding_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head-sha=$binding_sha" >> "$GITHUB_OUTPUT"
          branch_name="codex/bindings-chatgpt-$APP_VERSION-issue-$ISSUE_NUMBER"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$branch_name"

      - name: Remove rebase resolver files
        if: always()
        run: >-
          rm -rf
          "$RUNNER_TEMP/codex-rebase-home"
          "$RUNNER_TEMP/codex-npm"
          "$RUNNER_TEMP/rebase-auth-handoff"
          "$RUNNER_TEMP/rebase-auth-handoff-private.pem"
          "$RUNNER_TEMP/rebase-auth-decrypted"
          "$RUNNER_TEMP/rebase-resolver-prompt.md"
          "$RUNNER_TEMP/rebase-resolver.jsonl"
          "$RUNNER_TEMP/rebase-resolver-final.txt"

      - name: Open pull request
        id: pull-request
        env:
          APP_VERSION: ${{ needs.generate.outputs.version }}
          BINDING_MODE: ${{ needs.generate.outputs.binding-mode }}
          EXPECTED_HEAD_SHA: ${{ steps.binding-final.outputs.head-sha }}
          ISSUE_NUMBER: ${{ needs.generate.outputs.issue-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_name="codex/bindings-chatgpt-$APP_VERSION-issue-$ISSUE_NUMBER"
          if [[ "$BINDING_MODE" == "correction" ]]; then
            title="Update bindings for ChatGPT $APP_VERSION"
          else
            title="Create bindings for ChatGPT $APP_VERSION"
          fi
          body="Generated by the ChatGPT rebinding workflow. The shared CI workflow must pass before automatic merge.

          Tracks #$ISSUE_NUMBER."
          existing_pr="$(
            gh pr list \
              --head "$branch_name" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
            pr_url="$(
              gh pr view "$existing_pr" \
                --json url \
                --jq .url
            )"
          else
            pr_url="$(
              gh pr create \
                --base main \
                --head "$branch_name" \
                --title "$title" \
                --body "$body"
            )"
          fi
          gh pr view "$pr_url" \
            --json headRefOid,number,url \
            > "$RUNNER_TEMP/pull-request.json"
          jq -e \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            '.headRefOid == $headSha' \
            "$RUNNER_TEMP/pull-request.json" >/dev/null
          {
            echo "number=$(jq -r .number "$RUNNER_TEMP/pull-request.json")"
            echo "url=$(jq -r .url "$RUNNER_TEMP/pull-request.json")"
          } >> "$GITHUB_OUTPUT"

  validate-pull-request:
    needs: open-pull-request
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.open-pull-request.outputs.head-sha }}
      refresh-auth: false
    secrets: inherit

  merge-pull-request:
    needs:
      - generate
      - open-pull-request
      - validate-pull-request
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out tested binding
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.open-pull-request.outputs.head-sha }}
          fetch-depth: 0

      - name: Validate generated pull request
        env:
          APP_VERSION: ${{ needs.generate.outputs.version }}
          BINDING_MODE: ${{ needs.generate.outputs.binding-mode }}
          EXPECTED_HEAD_SHA: ${{ needs.open-pull-request.outputs.head-sha }}
          ISSUE_NUMBER: ${{ needs.generate.outputs.issue-number }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.open-pull-request.outputs.pr-number }}
          PR_URL: ${{ needs.open-pull-request.outputs.pr-url }}
        run: |
          gh pr view "$PR_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,title,author,baseRefName,headRefName,headRefOid,isCrossRepository \
            > "$RUNNER_TEMP/pull-request.json"
          if [[ "$BINDING_MODE" == "correction" ]]; then
            title="Update bindings for ChatGPT $APP_VERSION"
          else
            title="Create bindings for ChatGPT $APP_VERSION"
          fi
          jq -e \
            --arg title "$title" \
            --arg branch "codex/bindings-chatgpt-$APP_VERSION-issue-$ISSUE_NUMBER" \
            --arg headSha "$EXPECTED_HEAD_SHA" \
            --argjson number "$PR_NUMBER" \
            '
              .state == "OPEN" and
              .number == $number and
              .title == $title and
              .author.login == "app/github-actions" and
              .baseRefName == "main" and
              .headRefName == $branch and
              .headRefOid == $headSha and
              .isCrossRepository == false
            ' "$RUNNER_TEMP/pull-request.json" >/dev/null

      - name: Fast-forward tested binding and test main
        env:
          APP_VERSION: ${{ needs.generate.outputs.version }}
          EXPECTED_HEAD_SHA: ${{ needs.open-pull-request.outputs.head-sha }}
          ISSUE_NUMBER: ${{ needs.generate.outputs.issue-number }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.open-pull-request.outputs.pr-number }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          git push origin "$EXPECTED_HEAD_SHA:refs/heads/main"

          merged_sha="$(
            deadline=$((SECONDS + 60))
            while (( SECONDS < deadline )); do
              candidate="$(
                gh pr view "$PR_NUMBER" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json mergeCommit,state \
                  --jq 'select(.state == "MERGED") | .mergeCommit.oid'
              )"
              if [[ -n "$candidate" ]]; then
                echo "$candidate"
                break
              fi
              sleep 2
            done
          )"
          [[ "$merged_sha" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "GitHub did not mark the exact tested commit as merged" >&2
            exit 1
          }
          branch_name="codex/bindings-chatgpt-$APP_VERSION-issue-$ISSUE_NUMBER"
          git push origin --delete "$branch_name"

          release_base_sha="$(git rev-parse "$EXPECTED_HEAD_SHA^")"
          [[ "$release_base_sha" =~ ^[0-9a-f]{40}$ ]]
          validation_id="rebind-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          validation_title="CI ($validation_id)"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f protected_run=true \
            -f validation_id="$validation_id" \
            -f release_base_sha="$release_base_sha" \
            -f release_head_sha="$EXPECTED_HEAD_SHA"

          run_id=""
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle,headSha \
              > "$RUNNER_TEMP/main-ci-runs.json"
            run_id="$(
              jq -r \
                --arg headSha "$merged_sha" \
                --arg title "$validation_title" \
                '[.[] | select(.headSha == $headSha and .displayTitle == $title)][0].databaseId // empty' \
                "$RUNNER_TEMP/main-ci-runs.json"
            )"
            [[ -z "$run_id" ]] || break
            sleep 2
          done
          [[ -n "$run_id" ]] || {
            echo "Post-merge CI run did not appear for $merged_sha" >&2
            exit 1
          }

          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

  finalize-issue:
    if: >-
      always() &&
      (
        github.event_name != 'issues' ||
        (
          github.event.label.name == 'pending' &&
          startsWith(github.event.issue.title, 'ChatGPT ') &&
          endsWith(github.event.issue.title, ' available')
        )
      )
    needs:
      - request
      - mark-issue-in-progress
      - generate
      - open-pull-request
      - validate-pull-request
      - merge-pull-request
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Mark final issue status
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ISSUE_NUMBER: ${{ needs.request.outputs.issue-number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          PAYLOAD_ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          REQUEST_RESULT: ${{ needs.request.result }}
          REQUEST_VALIDATION_ERROR: ${{ needs.request.outputs.validation-error }}
          MARK_RESULT: ${{ needs.mark-issue-in-progress.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          APP_VALIDATION_ERROR: ${{ needs.generate.outputs.app-validation-error }}
          PR_RESULT: ${{ needs.open-pull-request.result }}
          PR_URL: ${{ needs.open-pull-request.outputs.pr-url }}
          VALIDATION_RESULT: ${{ needs.validate-pull-request.result }}
          MERGE_RESULT: ${{ needs.merge-pull-request.result }}
        run: |
          issue_number="$REQUEST_ISSUE_NUMBER"
          if [[ -z "$issue_number" ]]; then
            issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-$PAYLOAD_ISSUE_NUMBER}}"
          fi
          [[ "$issue_number" =~ ^[1-9][0-9]*$ ]] || {
            echo "cannot report workflow result without a valid issue number" >&2
            exit 1
          }

          gh label create in-progress \
            --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 \
            --description "Binding generation is running" \
            --force
          gh label create failed \
            --repo "$GITHUB_REPOSITORY" \
            --color D73A4A \
            --description "Binding generation failed" \
            --force
          gh label create success \
            --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 \
            --description "Binding generation succeeded" \
            --force

          current_labels="$(
            gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )"
          for label in pending in-progress failed success; do
            if grep -Fxq "$label" <<< "$current_labels"; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --remove-label "$label"
            fi
          done

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ \
            "$REQUEST_RESULT" == "success" &&
            "$MARK_RESULT" == "success" &&
            "$GENERATE_RESULT" == "success" &&
            "$PR_RESULT" == "success" &&
            "$VALIDATION_RESULT" == "success" &&
            "$MERGE_RESULT" == "success"
          ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label success
            success_body="$(
              printf \
                'Binding generation succeeded: [workflow run #%s](%s).\n\nPull request: [%s](%s)' \
                "$GITHUB_RUN_NUMBER" \
                "$run_url" \
                "$PR_URL" \
                "$PR_URL"
            )"
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$success_body"
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
            exit 0
          fi

          jobs_path="$RUNNER_TEMP/jobs.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$jobs_path"
          failure_details="$(
            jq -r '
              .jobs[]
              | select(
                  .conclusion != null
                  and .conclusion != "success"
                  and .conclusion != "skipped"
                )
              | (
                  [
                    .steps[]?
                    | select(
                        .conclusion != null
                        and .conclusion != "success"
                        and .conclusion != "skipped"
                      )
                    | "\(.name) (\(.conclusion))"
                  ]
                  | join(", ")
                ) as $steps
              | "- [\(.name)](\(.html_url)): "
                + (if $steps == "" then .conclusion else $steps end)
            ' "$jobs_path"
          )"
          if [[ -z "$failure_details" ]]; then
            failure_details="- Workflow stopped before GitHub reported a failed step."
          fi
          validation_error="${REQUEST_VALIDATION_ERROR:-$APP_VALIDATION_ERROR}"
          if [[ -n "$validation_error" ]]; then
            failure_details="$(
              printf -- '- %s\n%s' "$validation_error" "$failure_details"
            )"
          fi

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label failed
          failure_body="$(
            printf \
              'Binding generation failed: [workflow run #%s](%s).\n\n%s' \
              "$GITHUB_RUN_NUMBER" \
              "$run_url" \
              "$failure_details"
          )"
          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$failure_body"
