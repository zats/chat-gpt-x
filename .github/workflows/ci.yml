name: CI
run-name: ${{ inputs.validation_id && format('CI ({0})', inputs.validation_id) || 'CI' }}

on:
  workflow_dispatch:
    inputs:
      protected_run:
        description: Prevent this required post-merge run from being canceled
        required: false
        default: false
        type: boolean
      validation_id:
        description: Identifier for a required post-merge validation
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.protected_run
      && format('ci-protected-{0}', inputs.validation_id || github.run_id)
      || github.event_name == 'push'
      && format('ci-push-{0}', github.run_id)
      || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.protected_run) }}

jobs:
  refresh-component-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.refresh.outputs.updated }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 22
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh deterministic component hashes
        id: refresh
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "updated=false" >> "$GITHUB_OUTPUT"
          scripts/refresh-update-index-hashes.sh "$BASE_SHA"
          git diff --check
          if git diff --quiet -- updates/latest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Refresh component archive hashes"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

  test:
    needs: refresh-component-hashes
    if: >-
      always() &&
      needs.refresh-component-hashes.result == 'success' &&
      needs.refresh-component-hashes.outputs.updated != 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
      refresh-auth: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
    secrets: inherit

  component-release-plan:
    needs: refresh-component-hashes
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' &&
      needs.refresh-component-hashes.result == 'success' &&
      needs.refresh-component-hashes.outputs.updated != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out component source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate affected components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/component-releases.mjs "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/component-releases.json"
          node scripts/build-component-releases.mjs \
            "$RUNNER_TEMP/component-releases.json" \
            "$RUNNER_TEMP/component-release-artifacts"
          jq \
            '{generation, chatgptApi, bindings, extensions}' \
            "$RUNNER_TEMP/component-releases.json"

  publish-component-releases:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs:
      - test
      - component-release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested landing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build release artifacts
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          command -v zip >/dev/null
          node scripts/component-releases.mjs "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/component-releases.json"
          node scripts/build-component-releases.mjs \
            "$RUNNER_TEMP/component-releases.json" \
            "$RUNNER_TEMP/component-release-artifacts"
      - name: Publish immutable component releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/publish-component-releases.sh
          "$RUNNER_TEMP/component-release-artifacts/artifacts.json"
          "$GITHUB_SHA"
      - name: Publish verified update index
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/publish-update-index.sh
          updates/latest.json
          "$GITHUB_SHA"
