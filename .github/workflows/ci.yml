name: CI
run-name: ${{ inputs.validation_id && format('CI ({0})', inputs.validation_id) || 'CI' }}

on:
  workflow_dispatch:
    inputs:
      protected_run:
        description: Prevent this required post-merge run from being canceled
        required: false
        default: false
        type: boolean
      validation_id:
        description: Identifier for a required post-merge validation
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.protected_run
      && format('ci-protected-{0}', inputs.validation_id || github.run_id)
      || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.protected_run }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
      refresh-auth: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
    secrets: inherit
