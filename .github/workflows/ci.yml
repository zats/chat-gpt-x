name: CI
run-name: ${{ inputs.validation_id && format('CI ({0})', inputs.validation_id) || 'CI' }}

on:
  workflow_dispatch:
    inputs:
      protected_run:
        description: Prevent this required post-merge run from being canceled
        required: false
        default: false
        type: boolean
      validation_id:
        description: Identifier for a required post-merge validation
        required: false
        default: ''
        type: string
      release_base_sha:
        description: Base commit for component releases in a protected dispatch
        required: false
        default: ''
        type: string
      release_head_sha:
        description: Exact tested landing for component releases in a protected dispatch
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.protected_run
      && format('ci-protected-{0}', inputs.validation_id || github.run_id)
      || github.event_name == 'push'
      && format('ci-push-{0}', github.run_id)
      || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.protected_run) }}

jobs:
  refresh-component-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.refresh.outputs.updated }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 22
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Refresh deterministic component hashes
        id: refresh
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_UPDATE_DEPLOY_KEY: ${{ secrets.CHATGPTX_PR_UPDATE_DEPLOY_KEY }}
        run: |
          [[ -n "$PR_UPDATE_DEPLOY_KEY" ]] || {
            echo "CHATGPTX_PR_UPDATE_DEPLOY_KEY is required" >&2
            exit 1
          }
          echo "updated=false" >> "$GITHUB_OUTPUT"
          scripts/refresh-update-index-hashes.sh "$BASE_SHA"
          git diff --check
          if git diff --quiet -- updates/latest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Refresh component archive hashes"
          deploy_key="$RUNNER_TEMP/pr-update-deploy-key"
          printf '%s\n' "$PR_UPDATE_DEPLOY_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          export GIT_SSH_COMMAND="ssh -i $deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

  test:
    needs: refresh-component-hashes
    if: >-
      always() &&
      needs.refresh-component-hashes.result == 'success' &&
      needs.refresh-component-hashes.outputs.updated != 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
      refresh-auth: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
    secrets: inherit

  component-release-plan:
    needs: refresh-component-hashes
    if: >-
      always() &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          inputs.protected_run &&
          inputs.release_base_sha != '' &&
          inputs.release_head_sha != '' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      ) &&
      needs.refresh-component-hashes.result == 'success' &&
      needs.refresh-component-hashes.outputs.updated != 'true'
    runs-on: ubuntu-latest
    outputs:
      has_components: ${{ steps.plan.outputs.has_components }}
    steps:
      - name: Check out component source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate affected components
        id: plan
        env:
          BASE_SHA: ${{ inputs.release_base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.release_head_sha || github.event.pull_request.head.sha || github.sha }}
          RELEASE_BASE_SHA: ${{ inputs.release_base_sha }}
          RELEASE_HEAD_SHA: ${{ inputs.release_head_sha }}
        run: |
          if [[ -n "$RELEASE_BASE_SHA" || -n "$RELEASE_HEAD_SHA" ]]; then
            [[ "$RELEASE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_HEAD_SHA" == "$GITHUB_SHA" ]]
            git merge-base --is-ancestor "$RELEASE_BASE_SHA" "$RELEASE_HEAD_SHA"
            [[ "$RELEASE_BASE_SHA" != "$RELEASE_HEAD_SHA" ]]
          fi
          node scripts/component-releases.mjs "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/component-releases.json"
          node scripts/build-component-releases.mjs \
            "$RUNNER_TEMP/component-releases.json" \
            "$RUNNER_TEMP/component-release-artifacts"
          echo "has_components=$(
            jq -r '
              (.chatgptApi != null) or
              (.bindings | length > 0) or
              (.extensions | length > 0)
            ' "$RUNNER_TEMP/component-releases.json"
          )" >> "$GITHUB_OUTPUT"
          jq \
            '{generation, chatgptApi, bindings, extensions}' \
            "$RUNNER_TEMP/component-releases.json"

  publish-component-releases:
    if: >-
      (
        (
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.protected_run &&
          inputs.release_base_sha != '' &&
          inputs.release_head_sha != ''
        )
      ) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.component-release-plan.outputs.has_components == 'true'
    needs:
      - test
      - component-release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested landing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build release artifacts
        env:
          BASE_SHA: ${{ inputs.release_base_sha || github.event.before }}
          HEAD_SHA: ${{ inputs.release_head_sha || github.sha }}
        run: |
          command -v zip >/dev/null
          node scripts/component-releases.mjs "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/component-releases.json"
          node scripts/build-component-releases.mjs \
            "$RUNNER_TEMP/component-releases.json" \
            "$RUNNER_TEMP/component-release-artifacts"
      - name: Publish versioned component releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            set +e
            scripts/publish-component-releases.sh \
              "$RUNNER_TEMP/component-release-artifacts/artifacts.json" \
              "$GITHUB_SHA"
            publication_status=$?
            set -e
            if ((publication_status == 0)); then
              exit 0
            fi
            ((attempt < 3)) || exit 1
            echo "Component publication did not complete; retrying." >&2
            sleep $((attempt * 5))
          done

  publish-update-index:
    if: needs.publish-component-releases.result == 'success'
    needs:
      - publish-component-releases
    concurrency:
      group: publish-update-index
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested landing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish verified update index
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/publish-update-index.sh
          updates/latest.json
          "$GITHUB_SHA"
